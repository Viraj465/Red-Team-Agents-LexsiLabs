dpo_training:
  toolkit: aligntune
  dataset_repo: darkknight25/linux_window_priv_esic_dataset
  dataset_output: data/processed/dpo_privesc_hf.json
  base_model: Qwen/Qwen2.5-Coder-7B-Instruct
  output_dir: results/checkpoints/aligntune_privesc_lora
  num_epochs: 3
  learning_rate: 5.0e-6
  beta: 0.1
  batch_size: 2
  gradient_accumulation_steps: 4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  load_in_4bit: true
