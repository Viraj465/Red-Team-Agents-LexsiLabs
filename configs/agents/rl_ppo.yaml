# Reinforcement Learning Tactical Network Operator Configuration
agent:
  name: "RLTacticalNetworkOperator"
  default_policy: "heuristic"
  supported_policies: ["heuristic", "ppo", "sleep"]
  heuristic_class: "CybORG.Agents.SimpleAgents.FiniteStateRedAgent"

# PPO Hyperparameters (for training via train_rl.py)
ppo:
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  n_steps: 2048
  batch_size: 64
  n_epochs: 10

killchain_responsibilities:
  - "Subnet reconnaissance (DiscoverRemoteSystems, DiscoverNetworkServices)"
  - "Initial remote access (ExploitRemoteService)"
  - "Post-root impact execution (Impact, DegradeServices)"

