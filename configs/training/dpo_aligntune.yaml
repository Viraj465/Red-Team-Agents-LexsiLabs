# Lexsi Labs AlignTune DPO Training Configuration
training:
  toolkit: "aligntune"
  algorithm: "dpo"
  backend: "trl"
  base_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
  dataset_path: "data/processed/dpo_privesc_hf.json"
  output_dir: "results/checkpoints/aligntune_privesc_lora"

hyperparameters:
  num_train_epochs: 3
  learning_rate: 5.0e-6
  beta: 0.1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  max_length: 1024
  bf16: true
  gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

peft_lora:
  use_peft: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
